name: VID-P4 Manual Publish

# workflow_dispatch only -- explicit, operator-triggered, one video_posts row
# at a time. Reuses the same IG/YouTube secrets as social-automation.yml
# (same Instagram Business account, same YouTube channel). This is the
# fastest path to a live post given IG_ACCESS_TOKEN / YOUTUBE_CLIENT_SECRETS
# only exist in GitHub Secrets, not in any local .env.

on:
  workflow_dispatch:
    inputs:
      video_post_id:
        description: 'video_posts.id to publish'
        required: true
        type: string
      action:
        description: 'publish (post live) or resend-notification (re-send Stage F email using already-stored results, does not re-post)'
        required: false
        type: choice
        default: publish
        options:
          - publish
          - resend-notification

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r scripts/video/requirements.txt

      - name: Publish video
        working-directory: scripts/video
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.action }}" = "resend-notification" ]; then
            python engine.py --resend-notification "${{ github.event.inputs.video_post_id }}"
          else
            python engine.py --publish "${{ github.event.inputs.video_post_id }}"
          fi
