name: Staging Worker (bricks-of-india-staging)

# Manual dispatch only. Deploys a separate staging Worker with its own R2 bucket and Durable Object classes.
# No KV (production binds none). No custom route, no production bindings.
# Staging uses the production public URL and public key only (no staging Supabase project exists).
# The build FAILS if a service-role key is present for staging (no service key may reach a staging build).
# Uses the repo's existing deploy token.

on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Build and deploy staging Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - name: Create staging R2 bucket (if missing)
        run: npx wrangler r2 bucket create bricksofindia-next-cache-staging || echo "R2 bucket exists or create skipped"
      - name: Refuse the production project
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if printf '%s' "$STAGING_SUPABASE_URL" | grep -q 'hqpaiarhmiocmjrzjhtw'; then echo "staging URL is the production project; stopped"; exit 1; fi
          node -e 'const k=process.env.STAGING_SUPABASE_SERVICE_ROLE_KEY||""; let r=""; try { r=JSON.parse(Buffer.from(k.split(".")[1]||"","base64url").toString()).ref||""; } catch (e) {} if (r==="hqpaiarhmiocmjrzjhtw") { console.log("service key is for the production project; stopped"); process.exit(1); } if (!r) { console.log("service key has no project ref; stopped"); process.exit(1); } console.log("staging project checks passed (values not printed)");'
      - name: Next.js build (public values only; staging service key for the sitemap prerender)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build
      - name: OpenNext Cloudflare build
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx opennextjs-cloudflare build
      - name: wrangler deploy (staging)
        run: npx wrangler deploy --config wrangler.staging.jsonc
