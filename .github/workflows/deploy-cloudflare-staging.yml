name: Staging Worker (bricks-of-india-staging)

# Manual dispatch only. Deploys a separate staging Worker with its own R2 bucket and Durable Object classes.
# No KV (production binds none). No custom route, no production bindings.
# Staging uses the production public URL and public key only (no staging Supabase project exists).
# The build FAILS if a service-role key is present for staging (no service key may reach a staging build).
# Uses the repo's existing deploy token.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to build (default staging-readonly)'
        required: false
        default: staging-readonly

concurrency:
  group: deploy-cloudflare-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Build and deploy staging Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Build environment names contain no service-role name
        run: |
          # Names only: the list is cut at '=', so no value is ever printed.
          if env | cut -d= -f1 | grep -iE 'service[_-]?role'; then
            echo "::error::A service-role name is in the staging build environment (names printed above). Staging uses the public values only."
            exit 1
          fi
          echo "build environment: no service-role name"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - name: Create staging R2 bucket (if missing)
        run: npx wrangler r2 bucket create bricksofindia-next-cache-staging || echo "R2 bucket exists or create skipped"
      - name: Next.js build (public values only)
        run: npm run build
      - name: OpenNext Cloudflare build
        run: npx opennextjs-cloudflare build
      - name: wrangler deploy (staging)
        run: npx wrangler deploy --config wrangler.staging.jsonc
      - name: "Proof 5 - deployed secret and binding names hold no service-role name"
        run: |
          # Names only. Secret names come from the deployed Worker; binding names from its config file.
          npx wrangler secret list --name bricks-of-india-staging --format json > secrets.json
          node -e '
            const fs = require("fs");
            const names = JSON.parse(fs.readFileSync("secrets.json", "utf8")).map(s => s.name);
            const config = fs.readFileSync("wrangler.staging.jsonc", "utf8");
            const bindings = [...config.matchAll(/"(binding|name)"\s*:\s*"([^"]+)"/g)].map(m => m[2]);
            const all = [...names, ...bindings];
            const bad = all.filter(n => /service[_-]?role/i.test(n));
            console.log("secret names: " + names.length + ", binding names: " + bindings.length);
            if (bad.length) { console.log("::error::service-role name present: " + bad.join(", ")); process.exit(1); }
            console.log("proof 5: pass");
          '
          rm -f secrets.json
