name: Weekly Technical Hygiene

on:
  schedule:
    - cron: '0 4 * * 1'  # Monday 04:00 UTC = Monday 09:30 IST
  workflow_dispatch:

jobs:
  hygiene:
    name: Weekly site and infrastructure checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Chromium
        run: sudo apt-get install -y chromium-browser

      - name: Install dependencies
        run: npm ci

      - name: Run technical hygiene checks
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL: ${{ secrets.BRIEF_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHROME_PATH: /usr/bin/chromium-browser
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
        run: npx tsx scripts/technical-hygiene.mjs
