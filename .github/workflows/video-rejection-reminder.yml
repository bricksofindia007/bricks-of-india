name: VID-P4 Rejection Review Reminder

# Biweekly content_rejections review reminder, added 2026-07-07. Cron can't
# cleanly express "every 14 days" -- runs weekly instead and self-gates in
# engine.py::check_and_send_rejection_reminder() on the durably-stored
# content_rejection_reminders.last_reminder_sent_at, only actually sending
# (and updating that timestamp) if >=14 days have passed AND at least one
# content_rejections row is still review_status='pending'. Silent no-op
# otherwise -- most weekly ticks are expected to do nothing.

on:
  schedule:
    # Staggered 2026-08-16 (was 0 3 * * 1) -- collided with content-quality.yml/
    # snapshot-prices.yml at the same minute on Mondays.
    - cron: '40 3 * * 1'  # every Monday, 03:40 UTC = 09:10 IST
  workflow_dispatch:  # manual trigger for testing

jobs:
  # FP6.4 quota gate (P4 Step 2): non-essential workflow -- pauses when a
  # Free-plan guard is closed (storage >= 800 MB / DB >= 400 MB / egress
  # projected >= 4.0 GB) or usage is unreadable. See quota-gate.yml.
  quota-gate:
    uses: ./.github/workflows/quota-gate.yml
    permissions:
      contents: read
      actions: write
    with:
      job: video-rejection-reminder
      needs: 'read'
    secrets: inherit

  check:
    needs: [quota-gate]
    if: needs.quota-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # 6 most recent runs: 1m54s-2m55s (gh run list
    # --workflow=video-rejection-reminder.yml --limit 10, 2026-08-18). ~2.5x
    # observed max.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        # Full requirements.txt, not just the supabase/resend this check
        # actually needs -- engine.py imports moviepy/PIL/numpy/whisper
        # unconditionally at module load regardless of which CLI flag is
        # used, so a minimal install would ImportError before argparse ever
        # runs. Matches the other video-*.yml workflows' install step.
        run: pip install -r scripts/video/requirements.txt

      - name: Check and send rejection reminder if due
        working-directory: scripts/video
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python engine.py --check-rejection-reminder
