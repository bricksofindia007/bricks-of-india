# TEMPORARY (remove before merge): sends one test alert from GitHub Actions through the shared alert module.
name: alert-wiring-test
on:
  push:
    branches: [t2/generator-anon-key]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Send the test alert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL: ${{ secrets.BRIEF_EMAIL }}
        run: node scripts/lib/alert-wiring-test.mjs
