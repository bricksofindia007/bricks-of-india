name: anon-probe

# Read-only audit: what an anonymous visitor can read or insert. Manual trigger only.
# Prints status codes and row counts. Never prints the URL, the key, or row content.

on:
  workflow_dispatch:
  push:
    branches: [b4-anon-audit]

permissions:
  contents: read

jobs:
  probe:
    name: Anonymous access probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Probe (status codes and counts only)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node scripts/audit/anon-probe.mjs | tee probe.txt
          {
            echo '```'
            cat probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
