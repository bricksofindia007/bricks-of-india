# IG-TOK auto-refresh — makes IG-TOK-01-style manual re-exchanges permanent history.
#
# Facebook Graph long-lived tokens (~60 days) can be exchanged for a fresh
# 60-day token any time before expiry via oauth/access_token with
# grant_type=fb_exchange_token. Running this on the 1st and 15th means the
# token is never more than ~15 days old — expiry becomes unreachable.
#
# REQUIRED SECRETS (one-time setup, see runbook in workflow summary):
#   FB_APP_ID        — Meta app ID (from developers.facebook.com app dashboard)
#   FB_APP_SECRET    — Meta app secret
#   IG_ACCESS_TOKEN  — the current long-lived token (already exists)
#   ADMIN_PAT        — fine-grained PAT, this repo only, "Secrets: read/write"
#                      (GITHUB_TOKEN cannot update repo secrets — PAT required)
#
# Failure mode: any step failing sends the standard failure email via the
# social-automation notifier so it never dies silently.
#
# KNOWN LIMITATION (confirmed 2026-07-26): re-exchanging a token that is
# ALREADY long-lived does not reliably reset Meta's 60-day clock the way
# exchanging a short-lived token does — Meta can hand back a token that is
# functionally the same underlying session, still expiring on its original
# schedule. The 2026-07-15 run "succeeded" by every check this workflow had
# (fresh access_token string, passed /me validation) but the resulting token
# died 8 days later, not 60. The new expires_in check below stops that from
# being silently reported as success — it does NOT make the renewal actually
# work long-term; that requires a Meta System User (non-expiring) token,
# which is the planned durable fix, pending Abhinav in Meta Business Manager.
# This workflow is a stopgap until that lands.

name: ig-token-refresh

on:
  schedule:
    - cron: '0 5 1,15 * *'   # 1st + 15th, 10:30 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exchange for fresh 60-day token
        id: exchange
        env:
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FB_APP_ID" ] || [ -z "$FB_APP_SECRET" ]; then
            echo "::error::FB_APP_ID / FB_APP_SECRET secrets not set — see workflow header runbook"
            exit 1
          fi
          RESP=$(curl -sf "https://graph.facebook.com/v19.0/oauth/access_token" \
            --data-urlencode "grant_type=fb_exchange_token" \
            --data-urlencode "client_id=${FB_APP_ID}" \
            --data-urlencode "client_secret=${FB_APP_SECRET}" \
            --data-urlencode "fb_exchange_token=${IG_ACCESS_TOKEN}")
          NEW_TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$NEW_TOKEN" ]; then
            echo "::error::Exchange returned no access_token: $(echo "$RESP" | head -c 200)"
            exit 1
          fi
          echo "::add-mask::$NEW_TOKEN"
          echo "new_token=$NEW_TOKEN" >> "$GITHUB_OUTPUT"

          # Re-exchanging an already-long-lived token can silently return one
          # with barely any life left instead of a fresh 60 days (see runbook
          # note above, confirmed 2026-07-26). Refuse to commit that as a
          # "successful" rotation — 30 days is comfortably more than the
          # 15-day cadence between runs.
          EXPIRES_IN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('expires_in', 0))")
          echo "New token expires_in: ${EXPIRES_IN}s"
          MIN_EXPIRES_IN=$((30 * 24 * 60 * 60))
          if [ "$EXPIRES_IN" -lt "$MIN_EXPIRES_IN" ]; then
            echo "::error::Exchange returned only ${EXPIRES_IN}s (< 30 days) — this is the already-long-lived-token no-op, not a fresh 60-day grant. NOT updating secret. Manual re-auth with a fresh short-lived User Token from Graph API Explorer is required."
            exit 1
          fi

      - name: Validate new token against Graph /me
        env:
          NEW_TOKEN: ${{ steps.exchange.outputs.new_token }}
        run: |
          set -euo pipefail
          curl -sf "https://graph.facebook.com/v19.0/me?access_token=${NEW_TOKEN}" > /dev/null \
            || { echo "::error::New token failed /me validation — NOT updating secret"; exit 1; }

      - name: Update IG_ACCESS_TOKEN repo secret
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
          NEW_TOKEN: ${{ steps.exchange.outputs.new_token }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ADMIN_PAT secret not set — cannot update IG_ACCESS_TOKEN. See workflow header runbook."
            exit 1
          fi
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW_TOKEN"
          echo "IG_ACCESS_TOKEN rotated OK — next refresh in <=15 days."

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          pip install -q resend
          python3 - <<'PY'
          import os, resend

          # Strip BOM (U+FEFF) -- GitHub Secrets copied from BOM-encoded source
          # files include a leading U+FEFF byte that breaks the Bearer auth
          # header. Confirmed incident 2026-07-06 on this exact RESEND_API_KEY
          # secret (VID-P4's notifier.py). health-check.mjs and notifier.py
          # both strip this already; this alert script previously didn't.
          try:
              resend.api_key = os.environ['RESEND_API_KEY'].lstrip('﻿').strip()
              result = resend.Emails.send({
                  'from': 'BOI Alerts <alerts@bricksofindia.com>',
                  'to': ['abhinav@bricksofindia.com'],
                  'subject': '[BOI] IG token auto-refresh FAILED — manual action needed before expiry',
                  'html': '<p>ig-token-refresh workflow failed. Check the run logs. If not fixed, Instagram posting stops when the current token expires (60 days from last successful exchange).</p>',
              })
              print(f'[alert] Email sent. ID: {result.get("id")}')
          except Exception as exc:
              # If the alert itself breaks, leave a loud, specific trace instead
              # of the original workflow failure going unexplained with no signal
              # at all in either the log or the inbox.
              print(f'[alert] FAILED TO SEND ALERT EMAIL: {type(exc).__name__}: {exc}')
              raise
          PY
