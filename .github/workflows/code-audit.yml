name: code-audit

on:
  schedule:
    - cron: '0 5 * * 1'  # Monday 05:00 UTC = 10:30 IST
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: TypeScript type check
        id: typecheck
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Dependency audit
        id: audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Send failure alert
        if: steps.lint.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.audit.outcome == 'failure'
        env:
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          LINT_OUTCOME:      ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          AUDIT_OUTCOME:     ${{ steps.audit.outcome }}
        run: node scripts/code-audit-notify.mjs
