name: ONE-OFF — Live post 72152-1 (YouTube + Instagram)

# Single-purpose, single-use workflow for the confirmed live post of set
# 72152-1, using content already confirmed in chat and hardcoded in
# social-automation/live_post_72152.py -- no caption/title regeneration
# happens here. Not on any schedule. Delete after use.
on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r social-automation/requirements.txt

      - name: Run live_post_72152.py
        working-directory: social-automation
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
        run: python live_post_72152.py
