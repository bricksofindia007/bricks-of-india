name: Secret scan (every pull request)

# Scans the pull request's changes for credentials and key formats. It holds no list of sensitive words:
# the rules are the scanner's own secret patterns plus the repo's .gitleaks.toml (patterns only).
# On a finding the job fails and prints the rule name and file:line only, never the value.
on:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
