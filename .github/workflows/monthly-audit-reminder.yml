name: Monthly 360 Audit Reminder

on:
  schedule:
    - cron: '0 3 1 * *'  # 1st of the month, 03:00 UTC
  workflow_dispatch:

jobs:
  remind:
    name: Email monthly audit reminder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send reminder via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL: ${{ secrets.BRIEF_EMAIL }}
        run: |
          node -e "
            (async () => {
              const apiKey = process.env.RESEND_API_KEY.split(String.fromCharCode(65279)).join('');
              const res = await fetch('https://api.resend.com/emails', {
                method: 'POST',
                headers: { Authorization: \`Bearer \${apiKey}\`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  from: 'Bricks of India <abhinav@bricksofindia.com>',
                  to: [process.env.BRIEF_EMAIL],
                  subject: 'BOI Monthly 360° Audit due',
                  html: '<p>The monthly BOI 360° evidence audit is due.</p><p>Run the standing procedure in <code>docs/AUDIT_RUNBOOK.md</code>.</p>',
                }),
              });
              if (!res.ok) { console.error(\`Resend failed (\${res.status}): \${await res.text()}\`); process.exit(1); }
              console.log('Reminder sent.');
            })();
          "
