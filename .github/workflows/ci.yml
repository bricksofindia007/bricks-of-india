name: email-guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A newer push to the same pull request replaces the older run.
  group: email-guard-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the build and snapshot jobs need to run. They are skipped (and reported as
  # passing) when only docs or data-fix files changed, or when a push to main is the merge of a
  # pull request that already ran these checks.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.s.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: s
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = "push" ] && printf '%s' "$SUBJECT" | head -1 | grep -qE '\(#[0-9]+\)$'; then
            echo "push is a merged pull request: already checked"; echo "code=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then RANGE="$BASE...HEAD"; else RANGE="HEAD~1..HEAD"; fi
          CODE=$(git diff --name-only $RANGE | grep -vE '^(docs/|supabase/data-fixes/|briefs/|audit/)|\.md$' | wc -l)
          echo "changed code files: $CODE"
          if [ "$CODE" -gt 0 ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  verify-no-email-in-client-bundle:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 10 most recent runs: 1m58s-2m30s (gh run list --workflow=ci.yml --limit
    # 10, 2026-08-18). ~2.5x observed max.
    timeout-minutes: 8
    env:
      CONTACT_EMAIL:                  ${{ secrets.CONTACT_EMAIL }}
      RESEND_API_KEY:                 ${{ secrets.RESEND_API_KEY }}
      # Fix D (2026-09-26): the build and route scan run against a local
      # PostgREST stub (scripts/ci/supabase-stub.mjs), NOT production. Every
      # PR push used to prerender + render every static route against the
      # live database -- hundreds of API requests per run, each a ~2.5 KB
      # Supabase gateway log line (log ingest is over the Free quota). Only
      # the two content-integrity checks below read production, by design,
      # with the real keys passed at step level.
      NEXT_PUBLIC_SUPABASE_URL:       http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY:  ci-stub
      SUPABASE_SERVICE_ROLE_KEY:      ci-stub
      NEXT_PUBLIC_SITE_URL:           https://bricksofindia.com
      NEXT_PUBLIC_GA_MEASUREMENT_ID:  ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      # P11 item 5: a backspace or other control byte in a script/SQL/config file (the heredoc
      # escaping bug, twice) fails the build. No dependencies needed.
      - name: No control characters in tracked text files
        run: node scripts/ci/check-control-chars.mjs

      - run: npm ci

      - name: Review/aggregateRating schema integrity check (GSC-01)
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/check-review-schema-integrity.ts

      - name: Set-mention link integrity check (GEO-05b)
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/check-set-mention-links.ts

      - name: G15 extensions-schema exposure probe (FP3.0 #361)
        # CLAUDE.md G15: the hosted project's exposed-schema list is a
        # dashboard setting (no supabase/config.toml in this repo), so a repo
        # grep can't see it. One live anon request instead (a 1-row table
        # read; the /rest/v1/ root is 401 for anon): asking for the
        # `extensions` profile must fail with 406 PGRST106 (schema not
        # exposed). A 200 means `extensions` became reachable over the Data
        # API, and with it the http extension's functions (PUBLIC EXECUTE).
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          KEY=$(printf '%s' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" | sed 's/^\xEF\xBB\xBF//' | tr -d '\r\n')
          STATUS=$(curl -s -o /tmp/g15.json -w '%{http_code}' --max-time 20 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Accept-Profile: extensions" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/sets?select=set_number&limit=1")
          echo "extensions profile -> HTTP $STATUS: $(head -c 200 /tmp/g15.json)"
          if [ "$STATUS" = "406" ] && grep -q '"PGRST106"' /tmp/g15.json && ! grep -q 'exposed: [^"]*extensions' /tmp/g15.json; then
            echo "PASS: extensions schema is not exposed by the Data API (G15)"
          else
            echo "::error::G15: the extensions schema looks exposed via PostgREST (HTTP $STATUS). The http extension's functions would be callable by anon. Revert the Data API exposed-schemas change or get a security review + chat sign-off."
            exit 1
          fi

      - name: Start Supabase stub (build + route scan never touch production)
        run: |
          nohup node scripts/ci/supabase-stub.mjs > /tmp/supabase-stub.log 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:54321/rest/v1/health && break; sleep 0.5; done
          curl -sf -o /dev/null http://127.0.0.1:54321/rest/v1/health && echo "stub up"

      # P10: REVALIDATE_AUDIT=1 drops next.config's fixed Cache-Control hints from
      # THIS (CI-only) build, so each response carries Next's own s-maxage = the
      # route's effective revalidate for scripts/ci/revalidate-audit.ts below.
      # The deploy build (deploy-cloudflare.yml) never sets it.
      - run: npm run build
        env:
          REVALIDATE_AUDIT: '1'

      - name: Scan client bundle and static public files for email leak
        run: |
          # MEDIUM-53: widened from the literal "abhinav@bricksofindia.com" to any
          # local-part @bricksofindia.com — the old literal-only regex missed a
          # hello@bricksofindia.com mailto link shipped in public/brand/guide.html
          # (never caught because public/ static files were also outside scan scope).
          EMAIL_REGEX='[A-Za-z0-9._%+-]+@bricksofindia\.com'
          FAIL=0
          if grep -rE "$EMAIL_REGEX" .next/static/ 2>/dev/null; then
            echo "::error::email literal found in client static bundle"
            FAIL=1
          fi
          if grep -rE "$EMAIL_REGEX" public/*.txt 2>/dev/null; then
            echo "::error::email literal found in public/*.txt"
            FAIL=1
          fi
          if grep -rE "$EMAIL_REGEX" public/brand/ 2>/dev/null; then
            echo "::error::email literal found in public/brand/"
            FAIL=1
          fi
          if [ "$FAIL" -eq 0 ]; then
            echo "PASS: no email literal in client bundle or static public files"
          fi
          exit $FAIL

      - name: Scan rendered HTML for email leak + title defects (all built routes)
        run: |
          EMAIL_REGEX='[A-Za-z0-9._%+-]+@bricksofindia\.com'
          # Site-wide fallback title (src/app/layout.tsx's metadata.title.default)
          # -- a route rendering exactly this means it has no page-specific
          # metadata at all (the #110 class of bug).
          DEFAULT_TITLE='Bricks of India — LEGO Price Comparison & Reviews in India 2026'
          # MEDIUM-53: enumerate every static (non-dynamic-segment) app route from
          # the build's own route manifest instead of a hand-maintained shortlist —
          # a hardcoded 5-route list is exactly the kind of scope gap that let
          # public/brand/guide.html ship an email address undetected.
          node -e "
            const routes = Object.values(require('./.next/app-path-routes-manifest.json'))
              .filter(r => !r.includes('[') && !r.startsWith('/api/') && r !== '/_not-found');
            console.log(routes.join('\n'));
          " > /tmp/routes.txt
          echo "Scanning $(wc -l < /tmp/routes.txt) routes:"
          cat /tmp/routes.txt

          npm run start &
          SERVER_PID=$!
          sleep 8
          FAIL=0
          # #208 (Wave 1 PR-C): the site-wide default meta description is
          # whatever "/" renders (the homepage legitimately uses it). Any
          # other route rendering the same string has no real description.
          DEFAULT_DESC=$(curl -s -H "x-forwarded-proto: https" "http://localhost:3000/" | grep -oE '<meta name="description" content="[^"]*"' | head -1 | sed -E 's/.*content="([^"]*)"/\1/')
          echo "Default description (from /): $DEFAULT_DESC"
          while IFS= read -r route; do
            # src/middleware.ts (#114/#117) 308-redirects any request whose
            # x-forwarded-proto isn't "https" -- a bare local curl has no such
            # header, so without this every route here would 308 to an
            # unfollowed URL and every check below would silently run against
            # an empty body. Sending the header production visitors actually
            # arrive with (Cloudflare sets x-forwarded-proto: https) is more
            # correct than -L, which would exercise the redirect+refetch path
            # instead of the direct-render path real HTTPS traffic takes.
            STATUS=$(curl -s -o /tmp/route_body.html -w "%{http_code}" -H "x-forwarded-proto: https" "http://localhost:3000$route")
            HTML=$(cat /tmp/route_body.html)
            if echo "$HTML" | grep -qE "$EMAIL_REGEX"; then
              echo "::error::email literal found in rendered HTML at $route"
              FAIL=1
            fi
            # #119: title patterns the email-leak crawl was never pointed at.
            # Skipped for any non-200 route (redirects like the retired
            # /blog, /opinion sections -- Next's redirect() body is a bare
            # path string like "/guides", not HTML, and would false-positive
            # as "no title" -- or an error status) and for known non-HTML routes.
            if [ "$STATUS" != "200" ] || [ "$route" = "/sitemap.xml" ]; then
              :
            else
            TITLE=$(echo "$HTML" | grep -oE '<title>[^<]*</title>' | head -1 | sed -E 's/<\/?title>//g')
            if [ -z "$TITLE" ]; then
              echo "::error::route returned HTML but no <title> found at $route"
              FAIL=1
            else
              # Doubled brand/word prefix, e.g. "LEGO LEGO ..." (#109 class) --
              # same word (case-insensitive) repeated as the first two words.
              FIRST_WORD=$(echo "$TITLE" | awk '{print tolower($1)}')
              SECOND_WORD=$(echo "$TITLE" | awk '{print tolower($2)}')
              if [ -n "$FIRST_WORD" ] && [ "$FIRST_WORD" = "$SECOND_WORD" ]; then
                echo "::error::doubled leading word in title at $route: \"$TITLE\""
                FAIL=1
              fi
              # Generic/fallback title (#110 class) -- route has no page-specific metadata.
              # "/" is exempt: src/app/page.tsx deliberately sets its own title to
              # this exact string (it IS the homepage's real title), not a fallback.
              if [ "$route" != "/" ] && [ "$TITLE" = "$DEFAULT_TITLE" ]; then
                echo "::error::fallback/default title rendered at $route (no page-specific metadata): \"$TITLE\""
                FAIL=1
              fi
              # #208: doubled brand suffix -- a page title that already ends in
              # "| Bricks of India" run through layout.tsx's "%s | Bricks of
              # India" template. Page titles must go through buildMetadata().
              if echo "$TITLE" | grep -q "| Bricks of India | Bricks of India"; then
                echo "::error::doubled brand suffix in title at $route: \"$TITLE\""
                FAIL=1
              fi
            fi
            # #208: canonical present, og:url identical to it, and a real
            # (non-default) description on every non-home route.
            CANONICAL=$(echo "$HTML" | grep -oE '<link rel="canonical" href="[^"]*"' | head -1 | sed -E 's/.*href="([^"]*)"/\1/')
            OG_URL=$(echo "$HTML" | grep -oE '<meta property="og:url" content="[^"]*"' | head -1 | sed -E 's/.*content="([^"]*)"/\1/')
            DESC=$(echo "$HTML" | grep -oE '<meta name="description" content="[^"]*"' | head -1 | sed -E 's/.*content="([^"]*)"/\1/')
            case "$route" in /deals|/legal/privacy|/precision)
              echo "AFTER $route | title=$(echo "$HTML" | grep -oE '<title>[^<]*</title>' | head -1 | sed -E 's/<\/?title>//g') | canonical=${CANONICAL:-MISSING} | og:url=$OG_URL | desc=$(echo "$DESC" | cut -c1-70)…" ;;
            esac
            if [ -z "$CANONICAL" ]; then
              echo "::error::missing canonical at $route"
              FAIL=1
            elif [ "$OG_URL" != "$CANONICAL" ]; then
              echo "::error::og:url ($OG_URL) != canonical ($CANONICAL) at $route"
              FAIL=1
            fi
            if [ "$route" != "/" ] && [ -n "$DEFAULT_DESC" ] && [ "$DESC" = "$DEFAULT_DESC" ]; then
              echo "::error::default site description rendered at $route (no page-specific description)"
              FAIL=1
            fi
            fi
          done < /tmp/routes.txt
          # #220: JSON-LD lowPrice = displayed best in-stock price on 3
          # fixture set pages served by the stub (scripts/ci/jsonld-price-fixtures.mjs).
          node scripts/ci/check-jsonld-price.mjs http://localhost:3000 || FAIL=1
          # P10: every route's effective revalidate == its intended cadence
          # (src/lib/route-cadence.ts). Build-time routes from the prerender
          # manifest; per-param routes rendered from stub fixtures.
          AUDIT_BASE=http://localhost:3000 AUDIT_SAMPLES=ci npx tsx scripts/ci/revalidate-audit.ts || FAIL=1
          kill $SERVER_PID
          exit $FAIL

  snapshot-tests:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Same run-history basis as verify-no-email-in-client-bundle above (both
    # run per push/PR in this file's 10 most recent recorded runs).
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run prompt snapshot tests
        run: npm test

      # P12 4a: the same type check the weekly code-audit runs, now in this
      # REQUIRED per-PR job, so a type error can't reach main and surface
      # only on the next weekly audit (28 Sep run: 1 error; 4 by 29 Sep).
      - name: TypeScript type check
        run: npx tsc --noEmit

  # G19 (CLAUDE.md, 1 Oct 2026): fail if public text reveals how the site works --
  # public text files (robots.txt rules only, llms.txt, manifest, brand guide) and the
  # user-visible strings in site code. The term list is the G19_TERMS secret, never in
  # the repo; the job prints file:line only.
  g19-public-text:
    runs-on: ubuntu-latest
    # Pure file scan, no install: well under a minute.
    timeout-minutes: 3
    env:
      G19_TERMS: ${{ secrets.G19_TERMS }}
      G19_FORK_PR: ${{ github.event.pull_request.head.repo.fork || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: G19 public-text check
        run: node scripts/ci/g19-check.mjs
