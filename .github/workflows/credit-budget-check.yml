name: Credit Budget Check

# Daily Tier 2 (deploy budget) tracker — see docs/CREDIT_BUDGET.md for the
# full framework. Counts real commits to `main` since the current billing
# cycle's start date via plain `git log`, multiplies by 15 (credits per
# native Netlify deploy), and compares against the 350-credit Tier 2
# budget. Zero new credentials: no Netlify API access, just git history
# and the same GITHUB_TOKEN every workflow in this repo already gets.
#
# Built 2026-08-26 in direct response to the incident this same day's
# CREDIT_BUDGET.md documents: 28 commits to main in one morning
# (2026-08-23) each triggered a real native deploy before anyone noticed,
# because netlify.toml's ignore = "exit 0" guard had been removed. That
# guard is back (commit fc92f6c) as a full blanket block — this workflow
# is the earlier-warning half of the fix, so a real budget can eventually
# replace the blanket block instead of just living with it forever.

on:
  schedule:
    - cron: '15 3 * * *'  # 03:15 UTC = 08:45 IST — distinct minute from the other daily crons in this repo
  workflow_dispatch:

jobs:
  check-budget:
    name: Count deploys this cycle and flag if over threshold
    runs-on: ubuntu-latest
    # Checkout + a git rev-list count + a gh issue upsert -- no installs,
    # no network calls beyond the GitHub API itself. Should take well
    # under a minute; 5 min is generous headroom, not sized from run
    # history since this workflow is new (same reasoning as
    # lint-workflows.yml's own timeout-minutes: 5).
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      TIER2_BUDGET_CREDITS: 350
      CREDITS_PER_DEPLOY: 15
      # Billing cycle reset day — see docs/CREDIT_BUDGET.md's "Billing
      # cycle" note (observed to float between the 22nd and 23rd; 23 is
      # the anchor confirmed against the 2026-08-23 incident timeline).
      # Adjust here if a future cycle boundary is confirmed to land on 22.
      CYCLE_RESET_DAY: 23

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute cycle start and count real deploys
        id: count
        run: |
          set -euo pipefail

          TODAY_DAY=$(date -u +%-d)
          THIS_MONTH_RESET=$(date -u +%Y-%m)-$(printf '%02d' "$CYCLE_RESET_DAY")

          if [ "$TODAY_DAY" -ge "$CYCLE_RESET_DAY" ]; then
            CYCLE_START="$THIS_MONTH_RESET"
          else
            # Before this month's reset day -> current cycle started last month's reset day.
            PREV_MONTH_ANCHOR=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
            CYCLE_START="${PREV_MONTH_ANCHOR}-$(printf '%02d' "$CYCLE_RESET_DAY")"
          fi
          CYCLE_START_TS="${CYCLE_START}T00:00:00Z"

          COMMIT_COUNT=$(git rev-list --count main --since="$CYCLE_START_TS")
          CREDITS_USED=$(( COMMIT_COUNT * CREDITS_PER_DEPLOY ))
          PCT=$(( CREDITS_USED * 100 / TIER2_BUDGET_CREDITS ))

          TIER=0
          if [ "$PCT" -ge 100 ]; then TIER=100; elif [ "$PCT" -ge 80 ]; then TIER=80; fi

          echo "cycle_start=$CYCLE_START_TS" >> "$GITHUB_OUTPUT"
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "credits_used=$CREDITS_USED" >> "$GITHUB_OUTPUT"
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"

          echo "Cycle start: $CYCLE_START_TS"
          echo "Commits to main this cycle: $COMMIT_COUNT"
          echo "Estimated credits used: $CREDITS_USED / $TIER2_BUDGET_CREDITS ($PCT%)"

      - name: Upsert standing tracking issue
        id: issue
        if: steps.count.outputs.tier != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_START: ${{ steps.count.outputs.cycle_start }}
          COMMIT_COUNT: ${{ steps.count.outputs.commit_count }}
          CREDITS_USED: ${{ steps.count.outputs.credits_used }}
          PCT: ${{ steps.count.outputs.pct }}
          TIER: ${{ steps.count.outputs.tier }}
        run: |
          set -euo pipefail
          TITLE="Netlify Deploy Credit Budget Tracker"
          TODAY=$(date -u +%Y-%m-%d)

          if [ "$TIER" = "100" ]; then
            STATUS_LINE="🚨 **Tier 2 deploy budget EXCEEDED** — every further push to main this cycle bills a native deploy beyond the planned budget."
          else
            STATUS_LINE="⚠️ **80% of Tier 2 deploy budget reached** — approaching the planned per-cycle limit."
          fi

          BODY=$(cat <<EOF
          ## Netlify Deploy Credit Budget — Tier 2 (deploy budget)

          Auto-updated daily by \`.github/workflows/credit-budget-check.yml\`.
          Full framework: \`docs/CREDIT_BUDGET.md\` (this covers Tier 2 only —
          Tier 1 keep-alive reserve is tracked manually in that doc's log,
          this workflow has no visibility into it).

          $STATUS_LINE

          | | |
          |---|---|
          | Billing cycle start | $CYCLE_START |
          | Commits to \`main\` this cycle | $COMMIT_COUNT |
          | Estimated credits used (commits × 15) | $CREDITS_USED |
          | Tier 2 budget | $TIER2_BUDGET_CREDITS |
          | % of budget | ${PCT}% |
          | Last checked | $TODAY (UTC) |
          EOF
          )

          # `// empty` matters here: with no match, `.[0]` is null and plain
          # `.number` on that would print the literal text "null" (jq's raw
          # mode unquotes strings, it doesn't suppress null) -- which would
          # make the `[ -z "$EXISTING" ]` check below false when it should
          # be true, and send a real issue number of "null" into gh issue edit.
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')

          if [ -z "$EXISTING" ]; then
            # First time this cycle hitting a threshold at all -- always fresh
            # information, always worth an email alongside the new issue.
            gh issue create --title "$TITLE" --body "$BODY" --label "credit-budget-alert"
            echo "notify_email=true" >> "$GITHUB_OUTPUT"
          else
            gh issue edit "$EXISTING" --body "$BODY"

            # Only post a fresh comment (and email) the first time THIS tier is
            # crossed THIS cycle -- avoid a daily duplicate once already past a
            # threshold. Detected by searching existing comments for this
            # tier's marker text alongside this cycle's start date, not a
            # hidden state field. Symmetric for both tiers: a carried-over
            # issue from a prior cycle re-crossing 80% gets its own fresh
            # comment+email too, not just the 100% escalation.
            if [ "$TIER" = "100" ]; then
              MARKER="EXCEEDED"
              COMMENT_BODY="🚨 **EXCEEDED** — cycle starting $CYCLE_START now at $CREDITS_USED / $TIER2_BUDGET_CREDITS credits ($COMMIT_COUNT commits). Consider re-adding netlify.toml's \`ignore = \"exit 0\"\` guard until the next cycle if deploys aren't essential."
            else
              MARKER="80% of Tier 2"
              COMMENT_BODY="⚠️ **80% of Tier 2 deploy budget reached** — cycle starting $CYCLE_START now at $CREDITS_USED / $TIER2_BUDGET_CREDITS credits ($COMMIT_COUNT commits)."
            fi

            ALREADY_NOTIFIED=$(gh issue view "$EXISTING" --json comments \
              | jq --arg m "$MARKER" --arg c "$CYCLE_START" '[.comments[] | select(.body | contains($m) and contains($c))] | length')
            if [ "${ALREADY_NOTIFIED:-0}" = "0" ]; then
              gh issue comment "$EXISTING" --body "$COMMENT_BODY"
              echo "notify_email=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # A GitHub issue alone doesn't reliably reach Abhinav -- he doesn't
      # check GitHub regularly, and the original Netlify email is what
      # caught the Aug 23 incident in the first place. This reuses the
      # RESEND_API_KEY/BRIEF_EMAIL secrets already provisioned in this repo
      # (health-check.yml, monthly-audit-reminder.yml, etc.) rather than
      # adding a new credential, and follows monthly-audit-reminder.yml's
      # own direct-fetch pattern (no npm install needed for one email).
      # Gated on the exact same notify_email flag as the issue
      # comment/creation above, so it fires at the same 80%/100% crossings,
      # not on every daily run once already past a threshold.
      - name: Send email alert (Resend)
        if: steps.issue.outputs.notify_email == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL: ${{ secrets.BRIEF_EMAIL }}
          CYCLE_START: ${{ steps.count.outputs.cycle_start }}
          COMMIT_COUNT: ${{ steps.count.outputs.commit_count }}
          CREDITS_USED: ${{ steps.count.outputs.credits_used }}
          PCT: ${{ steps.count.outputs.pct }}
          TIER2_BUDGET_CREDITS: ${{ env.TIER2_BUDGET_CREDITS }}
          TIER: ${{ steps.count.outputs.tier }}
        run: |
          node -e "
            (async () => {
              const apiKey = process.env.RESEND_API_KEY.split(String.fromCharCode(65279)).join('');
              const tier = process.env.TIER;
              const subject = tier === '100'
                ? 'BOI Netlify credit budget EXCEEDED this cycle'
                : 'BOI Netlify credit budget at 80% this cycle';
              const headline = tier === '100'
                ? 'Tier 2 (deploy) budget EXCEEDED for the current billing cycle.'
                : '80% of the Tier 2 (deploy) budget reached for the current billing cycle.';
              const lines = [
                headline,
                '',
                \`Cycle start: \${process.env.CYCLE_START}\`,
                \`Commits to main this cycle: \${process.env.COMMIT_COUNT}\`,
                \`Estimated credits used: \${process.env.CREDITS_USED} / \${process.env.TIER2_BUDGET_CREDITS} (\${process.env.PCT}%)\`,
                '',
                'Full framework: docs/CREDIT_BUDGET.md',
                'Tracking issue: search open issues for Netlify Deploy Credit Budget Tracker',
              ];
              const res = await fetch('https://api.resend.com/emails', {
                method: 'POST',
                headers: { Authorization: \`Bearer \${apiKey}\`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  from: 'Bricks of India <abhinav@bricksofindia.com>',
                  to: [process.env.BRIEF_EMAIL],
                  subject,
                  text: lines.join('\n'),
                }),
              });
              if (!res.ok) { console.error(\`Resend failed (\${res.status}): \${await res.text()}\`); process.exit(1); }
              console.log('Credit budget alert email sent:', subject);
            })();
          "
