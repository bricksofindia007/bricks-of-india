name: VID-QP Generate (cloud, manual trigger only)

# Cloud rendering for the Quiet Panic format. Separate from
# video-publish-poller-quiet-panic.yml, which only publishes already-
# approved rows -- this workflow does candidate selection + script-gen +
# TTS + audio mix + video assembly + Storage upload + quiet_panic_posts
# insert.
#
# workflow_dispatch ONLY, still deliberately no schedule trigger.
# UPDATED 2026-07-31: automated script-gen now exists
# (quiet_panic_script_gen.py, briefs/VID-QP-02.md section 2) -- segments_
# json is now OPTIONAL. Leave it blank to have process_candidate() call
# script-gen in fresh mode automatically; only pass it to render a hand-
# authored script instead (same manual path used for every script through
# RB20/WALL-E). Still no `schedule:` trigger: this workflow's own design
# (script-gen prompt, gate pass rate) needs operator review first, same
# standing rule as the rework poller (video-rework-poller-quiet-panic.yml).

on:
  workflow_dispatch:
    inputs:
      set_number:
        description: 'LEGO set number to render (must be in-stock/priced at MyBrickHouse or Toycra, and not already claimed in quiet_panic_posts -- see select_quiet_panic_candidate.py)'
        required: true
        type: string
      segments_json:
        description: 'OPTIONAL: hand-authored segment script as a JSON array (text/target_duration/voice/sfx_tag per segment), same schema as briefs/VID-QP-01.md section 6. Leave blank to auto-generate via script-gen (fresh mode) instead.'
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/video/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Validate candidate and assemble render input
        working-directory: scripts/video
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SET_NUMBER: ${{ inputs.set_number }}
          SEGMENTS_JSON: ${{ inputs.segments_json }}
        run: |
          python - <<'PYEOF'
          import json
          import os
          import sys

          import select_quiet_panic_candidate as sel

          set_number = os.environ['SET_NUMBER']
          segments_json_raw = os.environ.get('SEGMENTS_JSON', '').strip()

          result = sel.check_set_number(set_number)
          if not result.get('eligible'):
              print(f"ERROR: set_number {set_number!r} is not eligible: {result.get('reason')}", file=sys.stderr)
              sys.exit(1)

          candidate_entry = {
              'set_number': result['set_number'],
              'set_title': result['set_title'],
              'price_inr': result['price_inr'],
              'pieces': result.get('pieces'),
              'theme': result.get('theme'),
              'image_url': result['image_url'],
          }
          if segments_json_raw:
              candidate_entry['segments'] = json.loads(segments_json_raw)
              print('Hand-authored segments_json provided -- render will use it as-is.')
          else:
              print('No segments_json provided -- render will call script-gen (fresh mode) automatically.')

          candidate = [candidate_entry]

          with open('candidate.json', 'w') as f:
              json.dump(candidate, f, indent=2)

          print(f"Assembled candidate.json for {result['set_title']} (#{set_number}), price_inr={result['price_inr']}")
          PYEOF

      - name: Render Quiet Panic video
        working-directory: scripts/video
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY_ASMR: ${{ secrets.ELEVENLABS_API_KEY_ASMR }}
          GEMINI_SOCIAL_API_KEY: ${{ secrets.GEMINI_SOCIAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
        run: python generate_quiet_panic_video.py --test-batch candidate.json
