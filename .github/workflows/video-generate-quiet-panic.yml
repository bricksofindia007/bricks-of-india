name: VID-QP Generate (cloud, manual trigger only)

# Cloud rendering for the Quiet Panic format. Separate from
# video-publish-poller-quiet-panic.yml, which only publishes already-
# approved rows -- this workflow does candidate selection + TTS + audio
# mix + video assembly + Storage upload + quiet_panic_posts insert.
#
# workflow_dispatch ONLY, deliberately no schedule trigger yet.
# There is no automated script-gen for this format -- every segment
# script (including RB20's) has been hand-authored following the persona
# brief (briefs/VID-QP-01.md), not produced by an LLM call. Until that's
# built (or a decision is made to keep doing this by hand on a cadence),
# a scheduled run would fire with no script input and either fail
# immediately or have nothing to call. Add a `schedule:` trigger only
# once script-gen -- manual or automated -- has an actual answer for how
# it fires unattended.
#
# This run's segments_json input is chat-authored per candidate, same
# process used for RB20 throughout this build.

on:
  workflow_dispatch:
    inputs:
      set_number:
        description: 'LEGO set number to render (must be in-stock/priced at MyBrickHouse or Toycra, and not already claimed in quiet_panic_posts -- see select_quiet_panic_candidate.py)'
        required: true
        type: string
      segments_json:
        description: 'Segment script as a JSON array (text/target_duration/voice/sfx_tag per segment) -- hand-authored, same schema as briefs/VID-QP-01.md section 6'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/video/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Validate candidate and assemble render input
        working-directory: scripts/video
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SET_NUMBER: ${{ inputs.set_number }}
          SEGMENTS_JSON: ${{ inputs.segments_json }}
        run: |
          python - <<'PYEOF'
          import json
          import os
          import sys

          import select_quiet_panic_candidate as sel

          set_number = os.environ['SET_NUMBER']
          segments = json.loads(os.environ['SEGMENTS_JSON'])

          result = sel.check_set_number(set_number)
          if not result.get('eligible'):
              print(f"ERROR: set_number {set_number!r} is not eligible: {result.get('reason')}", file=sys.stderr)
              sys.exit(1)

          candidate = [{
              'set_number': result['set_number'],
              'set_title': result['set_title'],
              'price_inr': result['price_inr'],
              'image_url': result['image_url'],
              'segments': segments,
          }]

          with open('candidate.json', 'w') as f:
              json.dump(candidate, f, indent=2)

          print(f"Assembled candidate.json for {result['set_title']} (#{set_number}), price_inr={result['price_inr']}")
          PYEOF

      - name: Render Quiet Panic video
        working-directory: scripts/video
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY_ASMR: ${{ secrets.ELEVENLABS_API_KEY_ASMR }}
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
        run: python generate_quiet_panic_video.py --test-batch candidate.json
