name: VID-QP Generate (cloud, Mon/Wed/Fri schedule + manual trigger)

# Cloud rendering for the Quiet Panic format. Separate from
# video-publish-poller-quiet-panic.yml, which only publishes already-
# approved rows -- this workflow does candidate selection + script-gen +
# TTS + audio mix + video assembly + Storage upload + quiet_panic_posts
# insert.
#
# UPDATED 2026-07-31: automated script-gen now exists
# (quiet_panic_script_gen.py, briefs/VID-QP-02.md section 2) -- segments_
# json is now OPTIONAL. Leave it blank to have process_candidate() call
# script-gen in fresh mode automatically; only pass it to render a hand-
# authored script instead (same manual path used for every script through
# RB20/WALL-E).
#
# UPDATED 2026-08-01: schedule enabled after this session's script-gen
# persona tuning + gate hardening (word budget, verdict-reason,
# broadened banned-construction gate) was reviewed. Mon/Wed/Fri 03:30 UTC
# (09:00 IST). Scheduled runs carry no `inputs` context at all (that's
# workflow_dispatch-only) -- the "Validate candidate" step below falls
# back to select_quiet_panic_candidate.py's select_candidates() to
# auto-pick the next eligible set when SET_NUMBER comes through empty,
# rather than requiring a manually-supplied set_number every time.
# video-rework-poller-quiet-panic.yml's schedule stays OFF (workflow_
# dispatch only) until a real (non-fabricated) rejection has been
# reworked once by hand.

on:
  schedule:
    - cron: '30 3 * * 1,3,5'
  workflow_dispatch:
    inputs:
      set_number:
        description: 'LEGO set number to render (must be in-stock/priced at MyBrickHouse or Toycra, and not already claimed in quiet_panic_posts -- see select_quiet_panic_candidate.py)'
        required: true
        type: string
      segments_json:
        description: 'OPTIONAL: hand-authored segment script as a JSON array (text/target_duration/voice/sfx_tag per segment), same schema as briefs/VID-QP-01.md section 6. Leave blank to auto-generate via script-gen (fresh mode) instead.'
        required: false
        type: string
      reworked_from:
        description: 'OPTIONAL: quiet_panic_posts row id this render is a human-finalized rework of. When set, the normal "set_number not already claimed" eligibility check is skipped -- a rework is BY DEFINITION for an already-claimed set. Leave blank for a fresh candidate.'
        required: false
        type: string
      rerender_id:
        description: 'OPTIONAL: quiet_panic_posts.id to re-render IN PLACE with a corrected segments_json (fresh TTS/SFX/render/gates -- same row id/sequence_number, only content refreshed, never a new row). When set, segments_json is REQUIRED and set_number/reworked_from are ignored entirely -- this bypasses candidate selection/eligibility altogether, same as reworked_from does, but updates the existing row instead of inserting a new one.'
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    # 10 most recent runs: successful runs range 4m12s-19m49s (gh run list
    # --workflow=video-generate-quiet-panic.yml --limit 10, 2026-08-18) --
    # wide variance from the up-to-5x script-gen retry loop on pre-TTS
    # rejection, not a hang signal. ~2x observed max successful runtime.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/video/requirements.txt

      - name: Install ffmpeg
        # Step-level backstop, same precedent as video-generate-daily.yml's
        # identical step (added 2026-08-18 for the 6h apt-get hang there).
        # This step didn't have one until run 32179596753 (2026-08-18)
        # proved it needed it: a genuinely slow Azure archive mirror (not a
        # total stall -- packages kept trickling in, just far slower than
        # normal, e.g. one single small package took 4+ min between
        # progress lines) ate the entire 40-min job-level timeout before
        # ever reaching script-gen, and got cancelled by that job-level
        # ceiling rather than failing fast. The job-level timeout did its
        # job (bounded the run, no repeat of the 6h VID-P4 incident) but 8
        # min here lets a slow-mirror run fail fast enough to leave real
        # headroom for a manual retry within the same investigation
        # window, instead of burning the full 40-min budget on apt alone.
        timeout-minutes: 8
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Validate candidate and assemble render input
        id: validate
        if: inputs.rerender_id == ''
        working-directory: scripts/video
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SET_NUMBER: ${{ inputs.set_number }}
          SEGMENTS_JSON: ${{ inputs.segments_json }}
          REWORKED_FROM: ${{ inputs.reworked_from }}
        run: |
          python - <<'PYEOF'
          import json
          import os
          import sys

          import select_quiet_panic_candidate as sel

          set_number = os.environ.get('SET_NUMBER', '').strip()
          segments_json_raw = os.environ.get('SEGMENTS_JSON', '').strip()
          reworked_from = os.environ.get('REWORKED_FROM', '').strip()

          if reworked_from:
              # A rework is BY DEFINITION for an already-claimed set --
              # check_set_number()'s "not already claimed" eligibility
              # check does not apply here (added 2026-08-24, Kakamora's
              # human-finalized rework -- the normal fresh-candidate path
              # has no way to render a rework at all). price_inr comes
              # from the ORIGINAL row being reworked, matching
              # rework_quiet_panic.py's rework_one()'s own convention
              # (same real candidate data as the original), not a fresh
              # store_prices lookup.
              sb = sel.get_supabase()
              orig = sb.table('quiet_panic_posts').select('set_number,set_title,price_inr').eq('id', reworked_from).limit(1).execute()
              if not orig.data:
                  print(f"ERROR: reworked_from row {reworked_from!r} not found in quiet_panic_posts", file=sys.stderr)
                  sys.exit(1)
              orig_row = orig.data[0]
              set_number = orig_row['set_number']
              set_row = sb.table('sets').select('name,theme,pieces,image_url').eq('set_number', set_number).limit(1).execute()
              if not set_row.data:
                  print(f"ERROR: set_number {set_number!r} not found in sets table", file=sys.stderr)
                  sys.exit(1)
              s = set_row.data[0]
              result = {
                  'set_number': set_number,
                  'set_title': orig_row['set_title'],
                  'price_inr': orig_row['price_inr'],
                  'theme': s['theme'],
                  'pieces': s['pieces'],
                  'image_url': s['image_url'],
              }
              print(f"reworked_from={reworked_from} -- using original row's set_number/price_inr, catalog's theme/pieces/image_url.")
          elif set_number:
              result = sel.check_set_number(set_number)
              if not result.get('eligible'):
                  print(f"ERROR: set_number {set_number!r} is not eligible: {result.get('reason')}", file=sys.stderr)
                  sys.exit(1)
          else:
              # Scheduled run (cron) -- workflow_dispatch's `inputs` context
              # does not exist for schedule-triggered runs, so SET_NUMBER
              # comes through as an empty string, not absent. Auto-select
              # the next eligible candidate instead of failing.
              print('No set_number provided (scheduled run) -- auto-selecting next eligible candidate...')
              candidates = sel.select_candidates(limit=1)
              if not candidates:
                  print('No eligible candidates found right now -- nothing to render this run.')
                  # No candidate.json gets written below -- the Render step
                  # must not run against a nonexistent file. Flagging this
                  # explicitly via GITHUB_OUTPUT rather than letting the
                  # next step fail on a missing file (found 2026-08-01,
                  # while wiring the review-ready notification).
                  gh_output = os.environ.get('GITHUB_OUTPUT')
                  if gh_output:
                      with open(gh_output, 'a') as f:
                          f.write('no_candidate=true\n')
                  sys.exit(0)
              result = candidates[0]
              set_number = result['set_number']

          candidate_entry = {
              'set_number': result['set_number'],
              'set_title': result['set_title'],
              'price_inr': result['price_inr'],
              'pieces': result.get('pieces'),
              'theme': result.get('theme'),
              'image_url': result['image_url'],
          }
          if reworked_from:
              candidate_entry['reworked_from'] = reworked_from
          if segments_json_raw:
              candidate_entry['segments'] = json.loads(segments_json_raw)
              print('Hand-authored segments_json provided -- render will use it as-is.')
          else:
              print('No segments_json provided -- render will call script-gen (fresh mode) automatically.')

          candidate = [candidate_entry]

          with open('candidate.json', 'w') as f:
              json.dump(candidate, f, indent=2)

          print(f"Assembled candidate.json for {result['set_title']} (#{set_number}), price_inr={result['price_inr']}")
          PYEOF

      - name: Render Quiet Panic video
        id: render
        if: steps.validate.outputs.no_candidate != 'true'
        working-directory: scripts/video
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY_ASMR: ${{ secrets.ELEVENLABS_API_KEY_ASMR }}
          GEMINI_SOCIAL_API_KEY: ${{ secrets.GEMINI_SOCIAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          RERENDER_ID: ${{ inputs.rerender_id }}
          RERENDER_SEGMENTS_JSON: ${{ inputs.segments_json }}
        run: |
          if [ -n "$RERENDER_ID" ]; then
            echo "$RERENDER_SEGMENTS_JSON" > rerender_segments.json
            python generate_quiet_panic_video.py --rerender-id "$RERENDER_ID" --rerender-segments rerender_segments.json
          else
            python generate_quiet_panic_video.py --test-batch candidate.json
          fi

      # Two possible non-crash notification outcomes from the render step:
      # 'pending_approval' (gates passed, video ready) or
      # 'script_gen_exhausted' (added 2026-08-01: MAX_SCRIPT_GEN_ATTEMPTS
      # pre-TTS rejections in a row, no video produced this run, but not a
      # bug either -- see ScriptGenExhaustedError in generate_quiet_panic_
      # video.py). NOT on gate failure (publish_blocked, no notification --
      # gate_results already captured why, same as before) and NOT on a
      # real hard failure (unhandled exception -- the render step fails
      # normally, both notification branches below are skipped since
      # steps.render.outputs.status is unset). Reuses scripts/workflow-
      # failure-notify.mjs's NOTIFY_TYPE=custom mode rather than a second
      # notify script -- same Resend plumbing, same verified from-address,
      # same BRIEF_EMAIL secret.
      - name: Setup Node (for notification steps)
        if: steps.render.outputs.status == 'pending_approval' || steps.render.outputs.status == 'script_gen_exhausted'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies (for notification steps)
        if: steps.render.outputs.status == 'pending_approval' || steps.render.outputs.status == 'script_gen_exhausted'
        run: npm ci

      - name: Send "video ready for review" notification
        if: steps.render.outputs.status == 'pending_approval'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL: ${{ secrets.BRIEF_EMAIL }}
          NOTIFY_TYPE: custom
          SUBJECT: "Quiet Panic video ready for review: ${{ steps.render.outputs.set_title }} (#${{ steps.render.outputs.set_number }})"
          BODY: |
            A new Quiet Panic video passed all gates and is ready for your review.

            Set: ${{ steps.render.outputs.set_title }} (#${{ steps.render.outputs.set_number }})
            Price: Rs.${{ steps.render.outputs.price_inr }}
            Row id: ${{ steps.render.outputs.post_id }}

            Watch it here:
            ${{ steps.render.outputs.storage_url }}

            Watch this, then tell Claude "approved" or "rejected: <reason>" in chat.
        run: node scripts/workflow-failure-notify.mjs

      - name: Send "no video produced" notification
        if: steps.render.outputs.status == 'script_gen_exhausted'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL: ${{ secrets.BRIEF_EMAIL }}
          NOTIFY_TYPE: custom
          SUBJECT: "Quiet Panic: no video produced this run (${{ steps.render.outputs.set_title }})"
          BODY: |
            This run fired but produced no video -- not a crash, just every
            script-gen attempt failing the pre-TTS word-budget/verdict-reason
            check for this set.

            Set: ${{ steps.render.outputs.set_title }} (#${{ steps.render.outputs.set_number }})
            Attempts: ${{ steps.render.outputs.attempts }} (all failed, zero ElevenLabs cost incurred)

            Per-attempt detail:
            ${{ steps.render.outputs.attempts_detail }}

            This set stays eligible and may be picked up again next run. If
            the same set (or sets in general) keeps hitting this, it's worth
            a closer look at the script-gen prompt calibration rather than
            bad luck.
        run: node scripts/workflow-failure-notify.mjs
