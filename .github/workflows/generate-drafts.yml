name: generate-drafts

on:
  schedule:
    # Daily at 08:30 UTC (02:00 PT) — 90min after Gemini quota reset (07:00 UTC summer / PT 00:00).
    # Does not collide with publish-drafts cron times.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max drafts to generate (default 50 manual, 20 scheduled)'
        required: false
        default: '50'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY:          ${{ secrets.CEREBRAS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate approved drafts
        env:
          # Manual dispatch supplies inputs.limit (default 50 from input default).
          # Schedule trigger has no inputs context → fall through to RUN_LIMIT default of 20.
          RUN_LIMIT: ${{ inputs.limit || '20' }}
        run: |
          npx tsx scripts/generate-approved-drafts.ts --limit "$RUN_LIMIT"
