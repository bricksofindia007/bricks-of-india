name: generate-drafts

on:
  schedule:
    # Daily at 08:30 UTC (02:00 PT) — 90min after Gemini quota reset (07:00 UTC summer / PT 00:00).
    # Does not collide with publish-drafts cron times.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max drafts to generate (default 50 manual, 20 scheduled)'
        required: false
        default: '50'
      smoke_test:
        description: 'Force Gemini failure to verify Cerebras failover (sets SMOKE_TEST=1, overrides GEMINI_API_KEY with invalid value, forces RUN_LIMIT=1)'
        required: false
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY:          ${{ secrets.CEREBRAS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate approved drafts
        env:
          # smoke_test=true forces RUN_LIMIT=1 regardless of inputs.limit.
          # Schedule trigger has no inputs context → fall through to RUN_LIMIT
          # default of 30 (raised from 20 2026-06-29, Abhinav — proactive
          # capacity buffer matching the manual-dispatch default, now that
          # the Cerebras eligibility fix is live and should raise the real
          # success rate among attempts. Confirmed safe against Gemini's
          # actual free-tier limits before changing: RPM is unaffected by
          # total row count (the 7s DELAY_MS below is the only RPM throttle,
          # independent of RUN_LIMIT); RPD ceiling for Flash-Lite is
          # 1,000-1,500/day per Google's published rate limits as of this
          # writing — 30/day is nowhere near that ceiling. ~18/day new
          # content arrives (HIGH-52); revisit this number after 2-3 real
          # scheduled runs once there's actual post-fix success-rate data,
          # rather than guessing further from here.
          RUN_LIMIT: ${{ inputs.smoke_test && '1' || inputs.limit || '30' }}
          SMOKE_TEST: ${{ inputs.smoke_test && '1' || '' }}
          GEMINI_API_KEY: ${{ inputs.smoke_test && 'smoke_test_invalid_key_force_400' || secrets.GEMINI_API_KEY }}
        run: |
          npx tsx scripts/generate-approved-drafts.ts --limit "$RUN_LIMIT"
