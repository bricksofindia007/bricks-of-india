name: VID-QP Rework Poller

# Rejection-rework loop for the Quiet Panic format (built 2026-07-31,
# alongside quiet_panic_script_gen.py's shared script-gen function).
# Polls quiet_panic_posts for status='rejected' rows carrying a specific
# rejection_reason, regenerates the script in revision mode (same
# candidate data + the rejected script + the reason as explicit context),
# re-renders through the same pipeline used for fresh candidates
# (process_candidate() in generate_quiet_panic_video.py, imported not
# duplicated -- see rework_quiet_panic.py's module docstring), and inserts
# the result as a new pending_approval row referencing the original via
# reworked_from. Escalation cap: 2 rejected rows for the same set_number
# stops automated rework for that set and flags BOI_MASTER_TRACKER.md
# instead of a third automatic attempt.
#
# Schedule enabled 2026-08-05 -- operator's chat-Claude reviewed the design
# (script-gen prompt, escalation logic, render reuse) and approved unattended
# running. Hourly at :00, same cadence as the publish poller
# (video-publish-poller-quiet-panic.yml, which runs at :17) -- rework volume
# is expected to be low and this isn't time-sensitive the way publishing is.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:  # manual trigger still available for testing
    inputs:
      row_id:
        description: 'OPTIONAL: target one specific quiet_panic_posts row id directly (bypasses the escalation-gated queue fetch -- see rework_quiet_panic.py::rework_one_by_id()). Leave blank for the normal poll-and-rework behavior. Scheduled cron runs never set this -- unaffected either way.'
        required: false
        type: string
      force_provider:
        description: "OPTIONAL: force a specific provider for this dispatch only (only 'groq' is recognized). Leave blank for the standing Gemini-primary policy. Scheduled cron runs never set this -- unaffected either way."
        required: false
        type: string

jobs:
  rework:
    runs-on: ubuntu-latest
    # 10 most recent runs: 1m47s-8m38s (gh run list
    # --workflow=video-rework-poller-quiet-panic.yml --limit 10,
    # 2026-08-18). ~2x observed max (one 8m38s outlier among mostly 1-4min
    # runs -- occasional real rework processing, not treated as a hang
    # signal).
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/video/requirements.txt

      - name: Install ffmpeg
        # Step-level backstop, same precedent as video-generate-daily.yml's
        # and video-generate-quiet-panic.yml's identical step -- see the
        # latter's comment for the live incident (run 32179596753,
        # 2026-08-18) that proved this gap real: a slow (not fully stalled)
        # apt mirror can eat a job's entire timeout-minutes budget on this
        # step alone. This job's own timeout-minutes is already only 18 min
        # (tighter than the 40-min generate workflow), so failing fast here
        # matters even more for leaving room to notice and retry.
        timeout-minutes: 8
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Poll for rejected Quiet Panic rows and rework them
        working-directory: scripts/video
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY_ASMR: ${{ secrets.ELEVENLABS_API_KEY_ASMR }}
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          GEMINI_SOCIAL_API_KEY: ${{ secrets.GEMINI_SOCIAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          # Only set on a manual workflow_dispatch that explicitly filled
          # this input -- github.event.inputs is empty/absent on schedule
          # triggers, so FORCE_PROVIDER is unset (falsy) on every cron run.
          FORCE_PROVIDER: ${{ github.event.inputs.force_provider }}
        run: |
          if [ -n "${{ github.event.inputs.row_id }}" ]; then
            python rework_quiet_panic.py --row-id "${{ github.event.inputs.row_id }}"
          else
            python rework_quiet_panic.py --poll-and-rework
          fi
