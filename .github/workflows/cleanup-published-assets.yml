name: Weekly Storage Cleanup

# Runs cleanup-published-assets.js on a weekly schedule to remove
# posted_both/discarded assets (past the 72h age guard) from both
# social-assets (video_posts + posted_sets-derived shorts/reels/feed) and
# quiet-panic-assets (quiet_panic_posts, direct storage_url match).
#
# Flipped to always-live-on-schedule 2026-09-22, after a supervised dry-run
# observation period plus a real, verified one-off live run for both
# buckets (see BOI_MASTER_TRACKER.md for before/after byte counts and run
# evidence). Manual dispatch keeps an optional dry-run toggle for a
# deliberate preview before trusting a future selection-logic change.
#
# Sunday 04:00 UTC -- checked against this repo's other schedules to avoid
# collision: retiring-soon.yml (Sunday 02:00 UTC) and health-check.yml
# (daily 02:30 UTC) are the only other things running that morning.
on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no deletions)?'
        type: boolean
        default: false

jobs:
  cleanup:
    name: Storage cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run cleanup-published-assets.js
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Scheduled runs always go live now -- no override. Manual dispatch
        # respects its own dry_run input (defaults false, i.e. live, since
        # this is now the routine, proven path -- set true for a preview).
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node cleanup-published-assets.js --dry-run
          else
            node cleanup-published-assets.js
          fi
