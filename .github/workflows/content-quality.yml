name: Daily Content Quality Check

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC = 08:30 IST
  workflow_dispatch:

jobs:
  # FP6.4 quota gate (P4 Step 2): non-essential workflow -- pauses when a
  # Free-plan guard is closed (storage >= 800 MB / DB >= 400 MB / egress
  # projected >= 4.0 GB) or usage is unreadable. See quota-gate.yml.
  quota-gate:
    uses: ./.github/workflows/quota-gate.yml
    permissions:
      contents: read
      actions: write
    with:
      job: content-quality
      needs: 'read,write'
    secrets: inherit

  content-quality:
    needs: [quota-gate]
    if: needs.quota-gate.outputs.proceed == 'true'
    name: Lint → Auto-fix → Render → Verify → Report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run content linter
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/content-linter.mjs

      - name: Run auto-fixer
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/content-auto-fixer.mjs

      - name: Run visual renderer
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: node scripts/visual-renderer.mjs

      - name: Run verify
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/content-verify.mjs

      - name: Send quality report
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL: ${{ secrets.BRIEF_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: node scripts/content-quality-report.mjs
