name: radar-pipeline

on:
  schedule:
    # Daily 17:30 UTC = 23:00 IST
    - cron: '30 17 * * *'
  workflow_dispatch: {}

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: RADAR-01 — fetch signals
        run: node scripts/radar/fetch-rss.js

      - name: RADAR-02 — dedupe signals
        run: node scripts/radar/dedupe-signals.js

      - name: RADAR-03 — classify + queue to pending_drafts
        run: node scripts/radar/classify-signals.js

      # RADAR-03b (Nav & Content Overhaul, 2026-08-09) — deterministic
      # fortnightly Opinion cadence. Runs every day; only acts on the 14th
      # cycle (see scripts/radar/opinion-cadence.js for the day-check and
      # idempotency guard). Must run after RADAR-03 in the same job so it
      # can reclassify one of THIS run's freshly-queued 'news' rows before
      # tomorrow's 08:30 UTC generate-drafts.yml run ever sees it.
      - name: RADAR-03b — fortnightly Opinion cadence branch
        run: node scripts/radar/opinion-cadence.js

      # RADAR-08 (scripts/radar-08-reviews.js) removed from this cron
      # 2026-07-30 — reviews are now sourced exclusively by
      # scripts/reviews-source-refresh.mjs (.github/workflows/reviews-weekly-refresh.yml),
      # which requires a confirmed live MyBrickHouse/Toycra listing before a
      # set becomes review-eligible, rather than RADAR's RSS/in-stock-signal
      # matching. scripts/radar-08-reviews.js is left in the repo, unmodified,
      # in case it's needed for reference. Confirmed via a live duplicate:
      # RADAR-08 had independently queued a pending_drafts row for the exact
      # set (75442) that shipped as one of this new pipeline's first three
      # published reviews.
      # RADAR-04 (generate-drafts.js) removed from cron — generation is now
      # on-demand via the "Generate Article" button in /admin/pending.
