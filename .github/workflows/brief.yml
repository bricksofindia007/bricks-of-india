name: BOI Morning Brief

on:
  schedule:
    - cron: '30 1 * * *'  # 01:30 UTC = 07:00 IST
  workflow_dispatch:

jobs:
  # FP6.4 quota gate (P4 Step 2): non-essential workflow -- pauses when a
  # Free-plan guard is closed (storage >= 800 MB / DB >= 400 MB / egress
  # projected >= 4.0 GB) or usage is unreadable. See quota-gate.yml.
  quota-gate:
    uses: ./.github/workflows/quota-gate.yml
    permissions:
      contents: read
      actions: write
    with:
      job: brief
      needs: 'read'
    secrets: inherit

  brief:
    needs: [quota-gate]
    if: needs.quota-gate.outputs.proceed == 'true'
    name: Send daily morning brief
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send morning brief
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL: ${{ secrets.BRIEF_EMAIL }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: node scripts/morning-brief.mjs
