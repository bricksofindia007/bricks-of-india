name: Cloudflare metrics (read-only)

# BRANCH-ONLY COPY (not for merge): one read-only check; prints yes/no answers only.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'unused on this branch'
        required: false
        default: '7'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          for w in boi-scheduler boi-scheduler-staging; do
            j=$(curl -s -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$w/secrets")
            ok=$(echo "$j" | jq -r '.success')
            a=$(echo "$j" | jq -r '[.result[]?.name] | index("BOI_SCHEDULER_DISPATCH_TOKEN") != null')
            b=$(echo "$j" | jq -r '[.result[]?.name] | index("SNAPSHOT_HMAC_KEY") != null')
            n=$(echo "$j" | jq -r '[.result[]?] | length')
            echo "$w: read=$ok A=$a B=$b count=$n"
          done
