name: Cloudflare metrics (read-only)

# BRANCH-ONLY COPY (chore/ubuntu26-compat, not for merge): offline compatibility checks on the next Ubuntu runner.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'unused on this branch'
        required: false
        default: '7'

permissions:
  contents: read

jobs:
  video-social:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash scripts/ci/ubuntu26-compat.sh video
  site:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/ci/ubuntu26-compat.sh site
