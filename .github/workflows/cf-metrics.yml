name: Cloudflare metrics (read-only)

# BRANCH-ONLY COPY (not for merge): one-off switch. Input "days": on | off | read. Prints coded results only.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'on | off | read'
        required: false
        default: 'read'

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NS: 0af7352788ac4ba2a8c0440cfca849b1
          MODE: ${{ inputs.days }}
        run: |
          set -u
          B="https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces/$NS/values"
          cur=$(curl -s -H "Authorization: Bearer $CF" "$B/flag:v1")
          echo "read-check: $(echo "$cur" | jq -c 'if type == "object" and has("success") then {success, code: (.errors[0].code // null)} else {value_type: type, has_flag: has("dispatch_enabled")} end' 2>/dev/null || echo 'not json')"
          keys=$(curl -s -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces/$NS/keys?prefix=flag" | jq -c '{success, code: (.errors[0].code // null), n: ((.result // []) | length)}')
          echo "keys-check: $keys"
          echo "$cur" | jq -e 'type == "object" and (has("success") | not)' > /dev/null 2>&1 || cur='{}'
          echo "before: S=$(echo "$cur" | jq -r '.dispatch_enabled // false')"
          if [ "$MODE" = on ] || [ "$MODE" = off ]; then
            v=$([ "$MODE" = on ] && echo true || echo false)
            new=$(echo "$cur" | jq -c --argjson v "$v" '.dispatch_enabled = $v')
            r=$(curl -s -X PUT -H "Authorization: Bearer $CF" -H 'content-type: text/plain' --data "$new" "$B/flag:v1" | jq -c '{success, code: (.errors[0].code // null), msg: (.errors[0].message // null)}')
            echo "write: $r"
            sleep 5
            echo "after: S=$(curl -s -H "Authorization: Bearer $CF" "$B/flag:v1" | jq -r '.dispatch_enabled // false')"
          fi
          for s in mybrickhouse toycra; do echo "last-$s: $(curl -s -H "Authorization: Bearer $CF" "$B/meta:dispatch:$s" | jq -c '{slot, http_status}' 2>/dev/null || echo none)"; done
          echo "fail-note: $(curl -s -H "Authorization: Bearer $CF" "$B/meta:dispatch_fail" | jq -c '{slot, http_status}' 2>/dev/null || echo none)"
