name: VID-QP Publish Poller

# Standalone poller for the Quiet Panic format. Independent schedule and
# trigger from VID-P4's "VID-P4 Publish Poller" workflow (video-publish-
# poller.yml, */15 * * * *) -- runs hourly at :17 instead, deliberately not
# aligned to VID-P4's cadence. Calls publish_quiet_panic.py, which imports
# nothing from engine.py/publish.py; the only thing shared with VID-P4's
# poller is the underlying IG/YouTube account credentials (same Bricks of
# India account, not shared code). See briefs/VID-QP-02.md.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:  # manual trigger for testing

jobs:
  # P12 (29 Sep 2026): ESSENTIAL -- publishing approved content is never
  # paused by the FP6.4 quota gate (it was misclassified non-essential in
  # #395). The only guard left on this path is the in-code storage guard,
  # and only on an actual Storage upload (publish.py / publish_quiet_panic.py).

  poll:
    runs-on: ubuntu-latest
    # Issue #178 (b): one concurrency group per pipeline, shared with the
    # missing-platform retry job (video-retry-missing-platform.yml), so two
    # publishers for the same pipeline never overlap. Queued, never cancelled.
    concurrency:
      group: video-publish-vidqp
      cancel-in-progress: false
    # 10 most recent runs: 1m31s-5m0s (gh run list
    # --workflow=video-publish-poller-quiet-panic.yml --limit 10,
    # 2026-08-18). ~2.5x observed max.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/video/requirements.txt

      - name: Poll for approved Quiet Panic videos and publish
        working-directory: scripts/video
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
        run: python publish_quiet_panic.py --poll-and-publish
