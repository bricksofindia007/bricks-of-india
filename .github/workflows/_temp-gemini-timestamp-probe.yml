name: TEMP -- Gemini key timestamp probe

# ONE-OFF DIAGNOSTIC, not a permanent workflow. Fires one real, timestamped
# Gemini call per key (GEMINI_API_KEY, GEMINI_SOCIAL_API_KEY) so Abhinav
# can correlate against AI Studio's own Usage page and confirm which
# project each secret's traffic lands in. GitHub Secrets are write-only --
# this can't be resolved by reading the values back locally. Deleted after
# use; see scripts/canary/timestamp_probe.py for the actual probe logic
# (imports the real, unmodified check_gemini() from model_canary.py).

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/canary/requirements.txt

      - name: Run timestamp probe
        working-directory: scripts/canary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SOCIAL_API_KEY: ${{ secrets.GEMINI_SOCIAL_API_KEY }}
        run: python timestamp_probe.py
