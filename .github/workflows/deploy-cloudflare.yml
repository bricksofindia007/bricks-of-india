name: Build & Deploy to Cloudflare Workers

# Companion to the existing .github/workflows/deploy.yml, which is kept
# deliberately untouched as the historical record for the abandoned
# Netlify native-git-integration path -- that file is explicitly protected
# by CLAUDE.md's Netlify rules (no removal/bypass without explicit operator
# approval), so this is a new, separate file for the new Cloudflare Workers
# deploy target rather than overwriting it.
#
# Two jobs:
#   - build: Next.js/OpenNext compilation, no Cloudflare access at all.
#   - deploy: `wrangler deploy` + post-deploy smoke test.
#
# Approval gate (2026-09-26, capacity cut 1): the "production" GitHub
# Environment's required-reviewer rule (configured via the API -- repos/.../
# environments/production, reviewer: bricksofindia007 -- not expressible in
# this file) now sits on the BUILD job, and deploy follows it automatically.
# Before, build ran unattended on every push to main, and `next build`
# prerenders every static route against production Supabase (~160 API
# requests per build) -- so every merge whose deploy was later superseded
# still cost a full build's worth of Supabase requests (log ingest is over
# the Free quota). Build breaks are still caught before merge by ci.yml's
# email-guard build (against a local stub, Fix D). One approval still covers
# build + deploy.
#
# concurrency + cancel-in-progress: a newer push to main cancels any older
# run of this workflow -- including one waiting for approval -- so only the
# newest commit is ever up for approval. The newest commit always contains
# everything the older runs would have deployed.

on:
  # Manual only (B7, 4 Oct 2026): one bundled site deploy is started by hand after the release's
  # database changes; merges to main no longer start deploy runs.
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy (Next.js + OpenNext Cloudflare)
    runs-on: ubuntu-latest
    # Approval gate (see header): nothing builds until the run is approved.
    environment: production
    # Build and deploy run in ONE job (4 Oct 2026), so the built site never becomes a downloadable artifact.
    timeout-minutes: 25
    # No CI run history yet for this brand-new workflow -- same situation
    # CLAUDE.md's timeout-minutes rule already has a named precedent for
    # (video-feasibility-test.yml / video-script-gen-test-quiet-panic.yml
    # in .github/scripts/lint_workflow_timeouts.py's NO_TIMEOUT_HISTORY_YET
    # set). This file's job names have been added to that same set rather
    # than guessing a number. Revisit once ~3 real runs exist
    # (gh run list --workflow=deploy-cloudflare.yml --limit 10).
    env:
      NEXT_PUBLIC_SUPABASE_URL:       ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY:  ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL:           https://bricksofindia.com
      NEXT_PUBLIC_GA_MEASUREMENT_ID:  ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          # 22, matching the deploy job below -- wrangler requires >=22
          # there, and there's no reason for the two jobs in one pipeline
          # to run different Node versions. This job happened to succeed
          # on 20 (confirmed against run 34635918668, 2026-09-11), but
          # matching them removes an unexplained difference rather than
          # leaving one job on a version the other can't use.
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Next.js build
        run: npm run build

      - name: OpenNext Cloudflare build
        # No Cloudflare credentials passed here, on purpose -- this step
        # only compiles/bundles the worker locally into .open-next/, it
        # makes no Cloudflare API calls. Deploy-time credentials stay
        # scoped to the deploy job below, never exposed to this unattended
        # one.
        run: npx opennextjs-cloudflare build

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:  ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Post-deploy smoke test (#120)
        # #114 (no http->https redirect on the live domain) was invisible to
        # every check up to and including this workflow's own build job --
        # none of them make a real network request to the actual deployed
        # domain over either protocol; npm run build / npm ci never touch
        # bricksofindia.com at all. This is the one point in the pipeline
        # that runs strictly after a real deploy, so it's the only place
        # that can catch this class of bug (real edge/protocol behavior)
        # before a human happens to notice.
        run: |
          FAIL=0
          for host in bricksofindia.com www.bricksofindia.com; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$host/")
            if [ "$HTTP_STATUS" != "301" ] && [ "$HTTP_STATUS" != "308" ]; then
              echo "::error::http://$host did not redirect to https (got HTTP $HTTP_STATUS, expected 301/308)"
              FAIL=1
            else
              echo "OK: http://$host -> HTTP $HTTP_STATUS (redirect)"
            fi

            HTTPS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$host/")
            if [ "$HTTPS_STATUS" != "200" ]; then
              echo "::error::https://$host returned HTTP $HTTPS_STATUS, expected 200"
              FAIL=1
            else
              echo "OK: https://$host -> HTTP 200"
            fi
          done
          exit $FAIL

      - name: Prune old R2 cache builds (keep current + previous; P8 item 6, #242)
        # Tier 2 first live run (P8). Keeps the just-deployed build and the previous one (rollback);
        # every older incremental-cache/<build>/ prefix gets a 1-day lifecycle rule. The 30-day
        # backstop rule is preserved. continue-on-error: a failed prune must never fail a deploy
        # (G14 -- the worst case is storage staying where it is).
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MODE: apply
        run: CURRENT_BUILD_ID="$(cat .open-next/assets/BUILD_ID)" node scripts/ci/r2-prune-builds.mjs
