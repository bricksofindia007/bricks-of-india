name: Build dry run (no deploy)

# The production deploy's build steps, in the same order and with the same settings, stopping before the deploy.
# No secrets at all: the public values are fixed stubs (a dummy address and key), so the build runs the same code paths
# without a real project. The server key is a placeholder.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL:       http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY:  dry-run-anon-key
      SUPABASE_SERVICE_ROLE_KEY:      dry-run-placeholder
      NEXT_PUBLIC_SITE_URL:           https://bricksofindia.com
      NEXT_PUBLIC_GA_MEASUREMENT_ID:  ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Stub data API (answers every request with an empty result, no network)
        run: |
          node -e "require('http').createServer((q,s)=>{q.resume();q.on('end',()=>{s.writeHead(200,{'content-type':'application/json'});s.end(q.url.includes('count')?'0':'[]')})}).listen(54321,'127.0.0.1')" > stub.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w 'stub status %{http_code}\n' http://127.0.0.1:54321/rest/v1/sets
      - run: npm ci
      - name: Next.js build
        run: npm run build
      - name: OpenNext Cloudflare build
        run: npx opennextjs-cloudflare build
