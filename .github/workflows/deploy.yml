name: Build & Deploy to Netlify

on:
  push:
    branches:
      - main
    # Real fix for repeatedly-raised "unnecessary Netlify builds" (2026-07-05):
    # netlify.toml's `ignore` field does NOT govern this -- verified against
    # netlify-cli's own docs and --help output that `netlify deploy --build`
    # is a manual command that always builds unless --no-build is passed,
    # completely independent of Netlify's git-integration build-skip engine
    # (which `ignore` controls, and which this repo already disables via
    # `ignore = "exit 0"` -- meaning that field currently does nothing at
    # all, since deploys happen through this workflow's explicit CLI call,
    # not through Netlify's own webhook-triggered builds). This `paths:`
    # filter is what actually controls whether a real build+deploy runs.
    # Inclusion list (not paths-ignore) deliberately -- new non-site
    # directories added later (another scripts/<tool>/ subtree, another
    # docs/ file) are safe by default and never accidentally trigger a
    # deploy unless someone explicitly adds them here.
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "tailwind.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "netlify.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npx netlify-cli@latest deploy --build --prod

      # Recrawl acceleration used to ping Google's sitemap endpoint here,
      # but that endpoint was deprecated by Google in June 2023 and always
      # returns 404 -- confirmed live on this exact step (see
      # BOI_MASTER_TRACKER.md §Recrawl acceleration for the real response).
      # Removed rather than left in place returning 404 forever, which
      # would just be noise in deploy logs for someone debugging later.
      # Replaced by IndexNow (src/lib/indexnow.ts): article publishes
      # submit their own URL immediately (publish-draft.ts), and sets
      # submit via the incremental sync wired into scrape-prices.yml,
      # scoped to actual changed URLs rather than a deploy-time signal.
