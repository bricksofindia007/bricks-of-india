name: Build & Deploy to Netlify

on:
  push:
    branches:
      - main
    # Real fix for repeatedly-raised "unnecessary Netlify builds" (2026-07-05):
    # netlify.toml's `ignore` field does NOT govern this -- verified against
    # netlify-cli's own docs and --help output that `netlify deploy --build`
    # is a manual command that always builds unless --no-build is passed,
    # completely independent of Netlify's git-integration build-skip engine
    # (which `ignore` controls, and which this repo already disables via
    # `ignore = "exit 0"` -- meaning that field currently does nothing at
    # all, since deploys happen through this workflow's explicit CLI call,
    # not through Netlify's own webhook-triggered builds). This `paths:`
    # filter is what actually controls whether a real build+deploy runs.
    # Inclusion list (not paths-ignore) deliberately -- new non-site
    # directories added later (another scripts/<tool>/ subtree, another
    # docs/ file) are safe by default and never accidentally trigger a
    # deploy unless someone explicitly adds them here.
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "tailwind.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "netlify.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed so the sitemap-change check below can diff
          # against the pre-push SHA even for multi-commit pushes -- the
          # default shallow clone (depth 1) only has the latest commit.
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npx netlify-cli@latest deploy --build --prod

      # Recrawl acceleration: sitemap.xml is regenerated fresh from live DB
      # data on every build (src/app/sitemap.ts), so its actual URL set can
      # change even when sitemap.ts itself isn't touched -- but "don't ping
      # on every deploy regardless of relevance" per the operator's explicit
      # instruction means gating on the file most directly responsible for
      # sitemap *structure* changes (tier filtering, priority, new sections),
      # not every deploy this workflow's own paths: filter already lets
      # through. workflow_dispatch has no push diff to check -- pings
      # unconditionally there, since a manual dispatch is rare enough that
      # over-pinging costs nothing and Google's endpoint is a fire-and-forget
      # GET with no rate-limit concern at this volume.
      - name: Check if sitemap generation changed
        id: sitemap_check
        if: github.event_name == 'push'
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^src/app/sitemap\.ts$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping Google to recrawl sitemap
        if: github.event_name == 'workflow_dispatch' || steps.sitemap_check.outputs.changed == 'true'
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://www.google.com/ping?sitemap=https://bricksofindia.com/sitemap.xml")
          echo "Google sitemap ping response: HTTP $STATUS"
