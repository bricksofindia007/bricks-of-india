name: VID-P4 Publish Poller

# Stage 4 (cloud architecture pivot, 2026-07-06): runs every 15 minutes,
# looks for video_posts rows with status='approved' (set directly by
# chat-Claude via Supabase after the operator approves in chat -- no
# terminal/local machine needed for that step) and publishes each one via
# the existing publish_video_post() -- same IG Reels + YouTube Shorts flow,
# same disclosure split (YouTube containsSyntheticMedia=true, no IG AI-
# voiceover suffix), same hard gate + caption guards as today's manual
# post. Fires the Stage F notification once a post is confirmed live via
# fetch-back from each platform's own API.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:  # manual trigger for testing

jobs:
  # P12 (29 Sep 2026): ESSENTIAL -- publishing approved content is never
  # paused by the FP6.4 quota gate (it was misclassified non-essential in
  # #395). The only guard left on this path is the in-code storage guard,
  # and only on an actual Storage upload (publish.py / publish_quiet_panic.py).

  poll:
    runs-on: ubuntu-24.04
    # Issue #178 (b): one concurrency group per pipeline, shared with the
    # missing-platform retry job (video-retry-missing-platform.yml), so two
    # publishers for the same pipeline never overlap. Queued, never cancelled.
    concurrency:
      group: video-publish-vidp4
      cancel-in-progress: false
    # 10 most recent runs: 1m49s-3m29s (gh run list
    # --workflow=video-publish-poller.yml --limit 10, 2026-08-18). ~2.5x
    # observed max. 40 minutes covers the package step's worst case: two
    # attempts of (120 s update + 900 s install), plus the other steps.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          missing=""
          command -v ffmpeg >/dev/null || missing="$missing ffmpeg"
          command -v tesseract >/dev/null || missing="$missing tesseract-ocr"
          if [ -z "$missing" ]; then
            echo "ffmpeg and tesseract are already installed; skipping the package update"
            exit 0
          fi
          for attempt in 1 2; do
            if timeout 120 sudo apt-get update -y -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
               && timeout 900 sudo apt-get install -y -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 -o Acquire::http::Timeout=20 $missing; then
              exit 0
            fi
            echo "package step attempt $attempt failed"
          done
          echo "package step failed on both attempts; stopping"
          exit 1

      - name: Install Python dependencies
        run: pip install -r scripts/video/requirements.txt

      - name: Poll for approved videos and publish
        working-directory: scripts/video
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python engine.py --poll-and-publish
