name: Sync LEGO Catalogue

on:
  schedule:
    # Every Sunday 02:00 UTC (07:30 IST) — before weekend content work
    # Staggered 2026-08-16 (was 0 2 * * 0) -- collided with retiring-soon.yml
    # at the exact same minute every Sunday; both touch catalogue/sets tables.
    - cron: '15 2 * * 0'  # 02:15 UTC Sunday = 07:45 IST
  workflow_dispatch:

jobs:
  # FP6.4 quota gate (P4 Step 2): non-essential workflow -- pauses when a
  # Free-plan guard is closed (storage >= 800 MB / DB >= 400 MB / egress
  # projected >= 4.0 GB) or usage is unreadable. See quota-gate.yml.
  quota-gate:
    uses: ./.github/workflows/quota-gate.yml
    permissions:
      contents: read
      actions: write
    with:
      job: sync-catalogue
      needs: 'read,write'
    secrets: inherit

  sync:
    needs: [quota-gate]
    if: needs.quota-gate.outputs.proceed == 'true'
    name: Rebrickable → Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run catalogue sync
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-rebrickable.js

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[catalogue-sync-failed] Sync failed on ${new Date().toISOString().slice(0, 10)}`,
              body: [
                '## Catalogue sync failed',
                '',
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '**Common causes:**',
                '- `REBRICKABLE_API_KEY` expired or hit daily quota',
                '- Supabase connection issue (check `NEXT_PUBLIC_SUPABASE_URL` / `SUPABASE_SERVICE_ROLE_KEY`)',
                '- Row count assertion failed (< 5,000 rows after sync — partial fetch)',
                '',
                'Check the run log for the specific error. Re-run via Actions → Sync LEGO Catalogue → Run workflow.',
              ].join('\n'),
              labels: ['catalogue-sync-failed'],
            });
