name: BOI Social Automation

on:
  schedule:
    - cron: '30 6 * * *'   # 12:00 IST daily
  workflow_dispatch:         # Manual trigger for testing

jobs:
  post:
    runs-on: ubuntu-latest
    # 10 most recent runs: 6m52s-8m57s (gh run list
    # --workflow=social-automation.yml --limit 10, 2026-08-18). ~2x observed
    # max.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: pip install -r social-automation/requirements.txt

      - name: Run pipeline
        working-directory: social-automation
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python pipeline.py
