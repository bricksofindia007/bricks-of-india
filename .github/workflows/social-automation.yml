name: BOI Social Automation

on:
  schedule:
    - cron: '30 6 * * *'   # 12:00 IST daily
  workflow_dispatch:         # Manual trigger for testing

jobs:
  # FP6.4 quota gate, narrowed P12 (29 Sep 2026, Abhinav): publishing is
  # essential, so only the storage-upload guard (>= 800 MB) can pause this
  # job -- it uploads the image to Storage before posting (IG needs a public
  # URL). DB size and egress never pause it. See quota-gate.yml.
  quota-gate:
    uses: ./.github/workflows/quota-gate.yml
    permissions:
      contents: read
      actions: write
    with:
      job: social-automation
      needs: 'upload'
    secrets: inherit

  post:
    needs: [quota-gate]
    if: needs.quota-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      G19_TERMS: ${{ secrets.G19_TERMS }}  # G19 term list (never in the repo); gates fail closed without it
    # 10 most recent runs: 6m52s-8m57s (gh run list
    # --workflow=social-automation.yml --limit 10, 2026-08-18). ~2x observed
    # max.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: pip install -r social-automation/requirements.txt

      # G6 (2 Oct 2026): posts state only our live Indian price, or none. These
      # tests (no network) must pass before anything can post.
      - name: Indian-price rule tests
        working-directory: social-automation
        run: python -m unittest test_indian_price -v

      - name: Run pipeline
        working-directory: social-automation
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python pipeline.py
