name: Pins exercise (throwaway)

# Throwaway. Runs the real Python code paths under one pin set. No secrets, no posting.
# pins=current takes the requirements files from main; pins=proposed takes them from this branch.

on:
  pull_request:

permissions:
  contents: read

jobs:
  exercise:
    strategy:
      fail-fast: false
      matrix:
        pins: [current, proposed]
    name: exercise (${{ matrix.pins }} pins)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select the pin set
        run: |
          if [ "${{ matrix.pins }}" = "current" ]; then
            git checkout origin/main -- social-automation/requirements.txt scripts/video/requirements.txt scripts/shareables/requirements.txt
          fi
          grep -iE "^(pillow|requests|python-dotenv)" social-automation/requirements.txt scripts/shareables/requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install (the two requirements files the exercise uses)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r social-automation/requirements.txt -r scripts/shareables/requirements.txt pytest
      - name: Installed versions
        run: python -c "import PIL, requests, dotenv, importlib.metadata as m; print('Pillow', PIL.__version__, '| requests', requests.__version__, '| python-dotenv', m.version('python-dotenv'))"
      - name: Exercise the real code paths (no posting)
        run: python scripts/ci/pins_exercise.py
      - name: Unit tests the CI runs for these packages
        run: |
          cd social-automation
          python -m unittest test_indian_price
          python -m unittest test_post_prepared test_brick_rush_auto
