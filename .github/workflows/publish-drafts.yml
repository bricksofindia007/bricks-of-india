name: publish-drafts

on:
  schedule:
    - cron: '0 19 * * *'   # 00:30 IST — post-RADAR generation window
    - cron: '30 7 * * *'   # 13:00 IST — post Gemini quota reset
    - cron: '30 12 * * *'  # 18:00 IST — evening freshness run
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max drafts to publish (default 30)'
        required: false
        default: '30'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
      REBRICKABLE_API_KEY:       ${{ secrets.REBRICKABLE_API_KEY }}
      NEXT_PUBLIC_SITE_URL:      ${{ secrets.NEXT_PUBLIC_SITE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish approved drafts
        run: node scripts/publish-drafts.mjs --limit ${{ inputs.limit || '30' }}
