name: Lint Migration Grants

# Issue #182, 2026-09-24. Supabase Data API grants change, effective
# 2026-10-30: new public tables get NO automatic anon/authenticated/
# service_role grants -- including tables re-created by `supabase db reset`
# and preview branches from supabase/migrations/. Fails any PR whose added or
# modified migration creates a public table without an explicit GRANT in the
# same file, any public table in the directory left with no GRANT at all, and
# any blanket anon grant (GRANT ALL / ON ALL TABLES IN SCHEMA / non-SELECT to
# anon without an "-- anon-grant-ok:" justification). Grants must match the
# table's RLS intent. See .github/scripts/check_migration_grants.py.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/scripts/check_migration_grants.py'
      - '.github/workflows/lint-migration-grants.yml'

jobs:
  grants:
    runs-on: ubuntu-latest
    # Same workload class as lint-workflows.yml (git diff + one stdlib-only
    # Python scan, no installs) -- its 5-minute bound reused.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Find added/modified migrations
        id: changed
        run: |
          FILES=$(git diff --name-only --diff-filter=AM "origin/${{ github.event.pull_request.base.ref }}"...HEAD -- 'supabase/migrations/*.sql')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Changed migrations:"
          echo "$FILES"

      - name: Check explicit GRANTs (changed files + whole directory)
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: python .github/scripts/check_migration_grants.py $CHANGED_FILES
