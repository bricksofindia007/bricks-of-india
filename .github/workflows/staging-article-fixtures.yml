name: Staging article fixtures (staging only, manual)

# Adds fixture articles (new ones each run, run time in the title), one review (skipped if present) and one fixture set (900902) on STAGING only.
# Never production. Existing rows are never changed.
# Credential: environment secret STAGING_DB_URL in the staging-seed environment, which requires the owner's approval.
# The job refuses any address that contains the production project reference, and prints counts only.
on:
  workflow_dispatch:
    inputs:
      price_inr:
        description: 'Optional, staging only: price in rupees (digits) for fixture set 900902 at one store. Empty = no price step.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  seed-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging-seed
    steps:
      - uses: actions/checkout@v5

      - name: Refuse anything but staging
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if [ -z "$STAGING_DB_URL" ]; then echo "STAGING_DB_URL is not set"; exit 1; fi
          if printf '%s' "$STAGING_DB_URL" | grep -q 'hqpaiarhmiocmjrzjhtw'; then echo "address is the production project; stopped"; exit 1; fi
          echo "staging address check passed (value not printed)"

      - name: Seed the fixture rows
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
          psql "$STAGING_DB_URL" -X -q -v ON_ERROR_STOP=1 -f scripts/ci/seed-staging-article-fixtures.sql
          psql "$STAGING_DB_URL" -X -q -v ON_ERROR_STOP=1 -f scripts/ci/seed-staging-set-fixtures.sql

      - name: Price fixture (only when price_inr is given)
        if: inputs.price_inr != ''
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          PRICE_INR: ${{ inputs.price_inr }}
        run: |
          case "$PRICE_INR" in ''|*[!0-9]*) echo "price_inr must be digits only"; exit 1 ;; esac
          psql "$STAGING_DB_URL" -X -q -v ON_ERROR_STOP=1 -v price="$PRICE_INR" -f scripts/ci/seed-staging-price-fixture.sql

      - name: Count check (counts only)
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          psql "$STAGING_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select 'fixture_articles|' || count(*) from public.news_articles where excerpt = 'FIXTURE STAGING ONLY';"
          psql "$STAGING_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select 'fixture_reviews|' || count(*) from public.reviews where excerpt = 'FIXTURE STAGING ONLY';"
          psql "$STAGING_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select 'total_sets|' || count(*) from public.sets;"
          psql "$STAGING_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select 'total_store_prices|' || count(*) from public.store_prices;"
          psql "$STAGING_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select 'total_price_history|' || count(*) from public.price_history;"
          psql "$STAGING_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select 'fixture_sets|' || count(*) from public.sets where description = 'FIXTURE STAGING ONLY';"
