name: "DIAGNOSTIC — ADMIN_PAT secret metadata read test (throwaway)"

# One-off proof for the technical-hygiene.mjs IG-token-expiry fix staged in
# PR #40: does ADMIN_PAT's actual token scope permit reading a repo secret's
# `updated_at` metadata via the GitHub API? Never reads the secret's VALUE,
# only whether the metadata call itself succeeds and what it returns.
# workflow_dispatch only, no schedule. Delete this file once the answer is
# captured -- this is not meant to persist.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Call GitHub API for IG_ACCESS_TOKEN secret metadata
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          set -euo pipefail
          echo "Calling: GET /repos/${GITHUB_REPOSITORY}/actions/secrets/IG_ACCESS_TOKEN"
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/secrets/IG_ACCESS_TOKEN")
          echo "HTTP status: ${HTTP_CODE}"
          echo "Raw response body:"
          cat /tmp/resp.json
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Non-200 response -- ADMIN_PAT cannot read secret metadata, or the secret name is wrong."
            exit 1
          fi
          UPDATED_AT=$(python3 -c "import json; print(json.load(open('/tmp/resp.json')).get('updated_at',''))")
          CREATED_AT=$(python3 -c "import json; print(json.load(open('/tmp/resp.json')).get('created_at',''))")
          if [ -z "$UPDATED_AT" ]; then
            echo "::error::200 response but no updated_at field present -- unexpected shape."
            exit 1
          fi
          echo "SUCCESS: updated_at = ${UPDATED_AT}"
          echo "SUCCESS: created_at = ${CREATED_AT}"
          NOW_EPOCH=$(date +%s)
          UPDATED_EPOCH=$(date -d "$UPDATED_AT" +%s)
          AGE_DAYS=$(( (NOW_EPOCH - UPDATED_EPOCH) / 86400 ))
          echo "Computed age: ${AGE_DAYS} day(s) since last rotation."
